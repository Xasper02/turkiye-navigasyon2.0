<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ücretsiz Türkiye Navigasyon ve Rota Sistemi</title>
    
    <!-- Yapılandırılmış Eksiksiz CSS Bağlantıları -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; background: #f0f0f0; }
        .control-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 300px;
        }
        h3 { margin-top: 0; color: #333; font-size: 18px; border-bottom: 2px solid #28a745; padding-bottom: 8px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 11px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        button:hover { background: #218838; }
        .info-text { font-size: 12px; color: #666; margin-top: 10px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3>🗺️ Türkiye Navigasyon</h3>
        <input type="text" id="start" placeholder="Başlangıç Noktası (Örn: İstanbul)">
        <input type="text" id="end" placeholder="Varış Noktası (Örn: Ankara)">
        <button onclick="calculateManualRoute()">Rotayı Hesapla</button>
        <div class="info-text">
            <strong>İpucu:</strong> Harita üzerinde sırayla iki farklı noktaya <strong>SAĞ TIKLAYARAK</strong> da rotanızı anında çizebilirsiniz!
        </div>
    </div>

    <div id="map"></div>

    <!-- Yapılandırılmış Eksiksiz JS Kütüphaneleri -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    
    <script>
        // Haritayı Türkiye koordinatlarına odaklayarak başlatıyoruz
        const map = L.map('map').setView([38.9637, 35.2433], 6);

        // Doğru OpenStreetMap sunucu katmanı
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap katkıda bulunanlar'
        }).addTo(map);

        const geocoder = L.Control.Geocoder.nominatim();
        let routingControl = null;
        let clickWaypoints = [];

        function drawRoute(startLatLng, endLatLng) {
            if (routingControl) {
                map.removeControl(routingControl);
            }
            routingControl = L.Routing.control({
                waypoints: [startLatLng, endLatLng],
                routeWhileDragging: true,
                language: 'tr'
            }).addTo(map);
        }

        // Sağ Tıkla Rota Çizme Modülü
        map.on('contextmenu', function(e) {
            if (clickWaypoints.length >= 2) {
                clickWaypoints = [];
                // Önceki geçici işaretçileri temizle
                map.eachLayer(function (layer) {
                    if (layer instanceof L.Marker && !layer.options.draggable) {
                        map.removeLayer(layer);
                    }
                });
            }
            
            clickWaypoints.push(e.latlng);
            L.marker(e.latlng).addTo(map);

            if (clickWaypoints.length === 2) {
                drawRoute(clickWaypoints[0], clickWaypoints[1]);
            }
        });

        // Manuel Kelime Arama ile Rota Çizme Modülü
        function calculateManualRoute() {
            const startQuery = document.getElementById('start').value;
            const endQuery = document.getElementById('end').value;

            if (!startQuery || !endQuery) {
                alert("Lütfen başlangıç ve varış noktalarını doldurun.");
                return;
            }

            geocoder.geocode(startQuery, function(startResults) {
                if (startResults && startResults.length > 0) {
                    const startLatLng = startResults[0].center;

                    geocoder.geocode(endQuery, function(endResults) {
                        if (endResults && endResults.length > 0) {
                            const endLatLng = endResults[0].center;
                            drawRoute(startLatLng, endLatLng);
                        } else {
                            alert("Varış noktası bulunamadı.");
                        }
                    });
                } else {
                    alert("Başlangıç noktası bulunamadı.");
                }
            });
        }
    </script>
</body>
</html>
