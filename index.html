<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Türkiye Navigasyon ve Rota Sistemi</title>
    
    <!-- Yapılandırılmış Resmi Harita ve Eklenti Bağlantıları (CDN) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <!-- Google Fonts ve FontAwesome İkonları -->
    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f19; }
        
        #map { height: 100vh; width: 100%; }

        /* Havalı ve Yarı Saydam Kontrol Paneli */
        .control-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1); 
            width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h3 { 
            margin: 0 0 20px 0; color: #fff; font-size: 18px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        h3 i { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

        /* Modern Giriş Alanları */
        .input-group { position: relative; margin-bottom: 14px; }
        .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 14px; }
        
        input { 
            width: 100%; padding: 12px 12px 12px 40px; 
            background: rgba(30, 41, 59, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 10px; color: white; font-size: 14px;
        }
        input:focus { 
            outline: none; border-color: #10b981; 
            background: rgba(30, 41, 59, 1);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        input::placeholder { color: #64748b; }

        /* Parlayan Buton Efekti */
        button { 
            width: 100%; padding: 14px; background: #10b981; color: white; 
            border: none; border-radius: 10px; cursor: pointer; font-weight: 600; 
            font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
        button:hover { background: #059669; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }
        button:active { transform: translateY(1px); }

        .info { 
            font-size: 12px; color: #94a3b8; margin-top: 16px; text-align: center; 
            line-height: 1.5; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px;
        }
        .info strong { color: #34d399; }

        /* Haritadaki Rota Paneli Tasarımını Gizleme veya Özelleştirme */
        .leaflet-routing-container {
            background: rgba(15, 23, 42, 0.9) !important;
            color: white !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 12px !important;
            font-size: 13px;
        }
        .leaflet-routing-alt { color: white !important; border-bottom: 1px solid rgba(255,255,255,0.1) !important; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3><i class="fa-solid fa-compass fa-spin-slow"></i> TR Navigasyon Pro</h3>
        
        <div class="input-group">
            <i class="fa-solid fa-location-dot" style="color: #ef4444;"></i>
            <input type="text" id="start" placeholder="Başlangıç Noktası (Örn: İstanbul)">
        </div>
        
        <div class="input-group">
            <i class="fa-solid fa-flag-checkered" style="color: #10b981;"></i>
            <input type="text" id="end" placeholder="Varış Noktası (Örn: Ankara)">
        </div>
        
        <button onclick="calculateManualRoute()">
            <i class="fa-solid fa-route"></i> Rotayı Hesapla
        </button>
        
        <div class="info">
            <i class="fa-solid fa-circle-info"></i> Haritaya sırayla 2 kez <strong>SAĞ TIKLAYARAK</strong> hızlıca rota oluşturabilirsiniz!
        </div>
    </div>

    <div id="map"></div>

    <!-- JavaScript Kütüphaneleri (Eksiksiz Tanımlamalar) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    
    <script>
        // Haritayı Türkiye merkezli ve şık bir Gece/Karanlık Teması ile açıyoruz
        const map = L.map('map').setView([39.9334, 32.8597], 6);

        // Havalı "CartoDB Dark Matter" Karanlık Harita Katmanı
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        const geocoder = L.Control.Geocoder.nominatim();
        let routingControl = null;
        let clickWaypoints = [];
        let mapMarkers = [];

        function drawRoute(start, end) {
            // Eski rotayı ve haritaya manuel tıklandığında eklenen geçici işaretçileri temizle
            if (routingControl) { map.removeControl(routingControl); }
            mapMarkers.forEach(marker => map.removeLayer(marker));
            mapMarkers = [];

            // Yeni rotayı oluştur
            routingControl = L.Routing.control({
                waypoints: [start, end],
                routeWhileDragging: true,
                language: 'tr',
                collapsible: true,
                lineOptions: {
                    styles: [{ color: '#10b981', weight: 6, opacity: 0.85 }] // Parlayan yeşil rota çizgisi
                }
            }).addTo(map);
        }

        // Sağ tıkla rota modülü
        map.on('contextmenu', function(e) {
            if (clickWaypoints.length >= 2) { 
                clickWaypoints = []; 
                mapMarkers.forEach(marker => map.removeLayer(marker));
                mapMarkers = [];
            }
            
            clickWaypoints.push(e.latlng);
            
            // Seçilen noktalara şık işaretçiler ekle
            let markerColor = clickWaypoints.length === 1 ? 'red' : 'green';
            let tempMarker = L.marker(e.latlng).addTo(map);
            mapMarkers.push(tempMarker);
            
            if (clickWaypoints.length === 2) { 
                drawRoute(clickWaypoints[0], clickWaypoints[1]); 
            }
        });

        // Arama kutusu modülü
        function calculateManualRoute() {
            const startQuery = document.getElementById('start').value;
            const endQuery = document.getElementById('end').value;
            if (!startQuery || !endQuery) return alert("Lütfen başlangıç ve varış alanlarını doldurun.");

            geocoder.geocode(startQuery, function(res1) {
                if (res1 && res1.length > 0) {
                    geocoder.geocode(endQuery, function(res2) {
                        if (res2 && res2.length > 0) {
                            drawRoute(res1[0].center, res2[0].center);
                        } else {
                            alert("Varış noktası bulunamadı!");
                        }
                    });
                } else {
                    alert("Başlangıç noktası bulunamadı!");
                }
            });
        }
    </script>
</body>
</html>
